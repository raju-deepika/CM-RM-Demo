name: Auto Create CM PR

on:
  pull_request:
    branches:
      - dev-RM
    types: [closed]

jobs:
  auto-create:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

          
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Create Temp Branch from Feature Branch
        id: create-temp
        run: |
          FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}
          TEMP_BRANCH=temp-$FEATURE_BRANCH
          git fetch origin
          git checkout $FEATURE_BRANCH
          git checkout -b $TEMP_BRANCH
          git push origin $TEMP_BRANCH
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV

      - name: Install GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create PR or get existing PR URL
        id: create-pr
        run: |
          # Check if a PR already exists for temp branch -> dev-CM
          PR_URL=$(gh pr list --head ${{ env.TEMP_BRANCH }} --base dev-CM --limit 1 --json url --jq '.[0].url' 2>/dev/null || echo "")

          
          if [ -z "$PR_URL" ]; then
            # Create a new PR
            PR_URL=$(gh pr create \
              --base dev-CM \
              --head ${{ env.TEMP_BRANCH }} \
              --title "Synchronizing RM Changes to CM" \
              --body "Auto-created PR from temp branch ${{ env.TEMP_BRANCH }} to dev-CM. Please resolve conflicts if any, then merge." \
              --web=false)
          fi
          
          echo "Pull Request URL: $PR_URL"
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
