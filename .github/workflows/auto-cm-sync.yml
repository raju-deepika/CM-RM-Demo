name: Auto Create CM PR

on:
  pull_request:
    branches:
      - dev-RM
    types: [closed]

jobs:
  auto-create:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # required for full history

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Create Temp Branch from Feature Branch
        id: create-temp
        run: |
          FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}
          TEMP_BRANCH=temp-$FEATURE_BRANCH
          git fetch origin
          git checkout $FEATURE_BRANCH
          git checkout -b $TEMP_BRANCH
          git push origin $TEMP_BRANCH
          echo "Temp branch created: $TEMP_BRANCH"
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV

      - name: Create PR to dev-CM
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.TEMP_BRANCH }}   # temp branch as compare branch
          base: dev-CM                     # base branch
          title: "Synchronizing RM Changes to CM"
          body: |
            Auto-created PR from temp branch ${{ env.TEMP_BRANCH }} to dev-CM
            Please resolve conflicts if any, then merge.

      - name: Show PR URL
        run: |
          PR_URL=$(jq -r '.html_url' <<< '${{ steps.create-pr.outputs.pull-request }}')
          echo "Pull Request created: $PR_URL"