name: Auto Create CM PR

on:
  pull_request:
    branches:
      - dev-RM
    types: [closed]

jobs:
  auto-create:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Important to get full history

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Create Temp Branch from Feature Branch
        run: |
          FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}
          TEMP_BRANCH=temp-$FEATURE_BRANCH
          git fetch origin
          git checkout $FEATURE_BRANCH
          git checkout -b $TEMP_BRANCH
          git push origin $TEMP_BRANCH

      - name: Create PR to dev-CM
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: $TEMP_BRANCH   # head branch (the branch with changes)
          base: dev-CM           # base branch (CM branch)
          title: "Synchronizing RM Changes to CM"
          body: "Auto-created PR from temp branch $TEMP_BRANCH to dev-CM"