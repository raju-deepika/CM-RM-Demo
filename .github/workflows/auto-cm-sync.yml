name: Auto Create CM PR

on:
  pull_request:
    branches:
      - dev-RM
    types: [closed]

jobs:
  auto-create:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Create Temp Branch from Feature Branch
        id: create-temp
        run: |
          FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}
          TEMP_BRANCH=temp-$FEATURE_BRANCH
          git fetch origin
          git checkout $FEATURE_BRANCH
          git checkout -b $TEMP_BRANCH
          git push origin $TEMP_BRANCH
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV

      - name: Create PR to dev-CM
        id: pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.TEMP_BRANCH }}
          base: dev-CM
          title: "Synchronizing RM Changes to CM"
          body: "Auto-created PR from temp branch ${{ env.TEMP_BRANCH }} to dev-CM"
          draft: false

      - name: Get PR URL
        id: get-url
        run: |
          echo "PR_URL=$(jq -r '.html_url' <<< '${{ steps.pr.outputs.pull-request }}')" >> $GITHUB_ENV
          echo "PR_URL=${{ env.PR_URL }}"

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "PR Created: Sync RM to CM"
          to: "capgemini.raju@mercedes-benz.com"
          from: "github-actions@example.com"
          body: |
            Hello,

            A new Pull Request has been created to synchronize RM changes to CM.
            
            PR URL: ${{ env.PR_URL }}

            Please review and resolve any conflicts if needed, then merge.

            Thank you.
            